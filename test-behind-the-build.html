<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Behind the Build — Isolated Test</title>
<style>html, body { width: 100%; margin: 0; padding: 0; }</style>
<link rel="stylesheet" href="./styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="./_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="CaseStudy-BehindTheBuild.jsx"></script>
<script type="text/babel">
function TestApp() {
  const onBack = () => console.log('Back clicked');
  const onOpenProject = (project) => console.log('Open project:', project);
  
  const CaseStudyBehindTheBuild = window.CaseStudyBehindTheBuildExports?.CaseStudyBehindTheBuild;
  
  if (!CaseStudyBehindTheBuild) {
    return <div style={{padding: '32px', color: '#fff', background: '#080D0B'}}>CaseStudyBehindTheBuild not loaded. Check console for errors.</div>;
  }
  
  return <CaseStudyBehindTheBuild onBack={onBack} onOpenProject={onOpenProject} />;
}

function bootTest() {
  const ready = Boolean(window.React && window.ReactDOM && window.CaseStudyBehindTheBuildExports);
  if (!ready) {
    window.setTimeout(bootTest, 50);
    return;
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<TestApp />);
}

bootTest();
</script>
</body>
</html>
