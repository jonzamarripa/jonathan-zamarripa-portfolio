name: Install approved hero film (preview only)
on:
  push:
    branches:
      - design/hero-video-cohesion-2026-11-08
    paths:
      - .github/workflows/install-approved-hero.yml
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify approved owner-supplied film
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p assets/video assets/imagery
          curl -fLsS --retry 3 --retry-delay 2 'https://drive.usercontent.google.com/download?id=1tJVx6AQd4ye8WMAach36GNzEo86BSHHG&export=download&confirm=t' -o /tmp/approved-hero.mp4
          echo 'e3eae1c28f573dfc0102585c789ece95d9285fb49723c1b17dd8214c94722736  /tmp/approved-hero.mp4' | sha256sum -c -
          ffmpeg -hide_banner -loglevel error -y -i /tmp/approved-hero.mp4 -an -c:v libx264 -preset medium -crf 24 -pix_fmt yuv420p -movflags +faststart assets/video/hero-portrait-2026.mp4
          ffmpeg -hide_banner -loglevel error -y -ss 1 -i /tmp/approved-hero.mp4 -frames:v 1 -vf scale=1280:-2 -c:v libwebp -quality 82 assets/imagery/jonathan-hero-final-poster.webp
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 assets/video/hero-portrait-2026.mp4
      - name: Commit verified film and poster to preview branch
        shell: bash
        run: |
          git config user.name 'Portfolio Preview Asset Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/video/hero-portrait-2026.mp4 assets/imagery/jonathan-hero-final-poster.webp
          git diff --cached --quiet || (git commit -m 'Install verified right-aligned owner-supplied hero film [skip ci]' && git push)
